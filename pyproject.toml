    "pyvirtualdisplay==3.0.0",
    "requests==2.34.2",
    "tomlkit==0.15.0",
    "typing-extensions==4.16.0",
    "urllib3==2.7.0",
    "certifi==2026.6.17",
    "pillow==12.3.0",
    "imagehash==4.3.2",
    "logfire==4.37.0",
