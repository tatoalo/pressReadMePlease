[project]
name = "pressreadmeplease"
version = "4.0.0"
description = "A process for renewing PressReader access automagically."
authors = [{ name = "tatoalo", email = "apogliaghi@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.65.2",
    "pydantic==2.14.4",
    "requests==2.34.2",
    "tomlkit==0.15.3",
    "urllib3==2.8.0",
    "certifi==2026.11.20",
    "logfire==6.0.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pyvirtualdisplay==3.0.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
